<div class="max-w-4xl mx-auto p-6">
  <h2 class="text-3xl font-extrabold text-gray-800 mb-6 text-center">Spring Boot Products</h2>

  <!-- Loading State -->
  <div *ngIf="products.length === 0" class="flex justify-center items-center py-10">
    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
    <span class="ml-3 text-gray-600 font-medium">Loading products...</span>
  </div>

  <!-- Products Grid -->
  <div *ngIf="products.length > 0" class="grid gap-4 md:grid-cols-2">
    <div *ngFor="let product of products" class="bg-white p-5 rounded-xl shadow-md border border-gray-100 hover:shadow-lg transition-shadow">
      <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2 py-1 rounded">ID: {{ product.id }}</span>
      <!-- Bdel 'name' w 'price' b les attributs 7qiqiyn li f Product entity dyalek -->
      <h3 class="text-lg font-bold text-gray-900 mt-2 mb-1">{{ product.name }}</h3>
      <p class="text-green-600 font-semibold mb-2">Price: {{ product.price }} DH</p>
      <p class="text-gray-600 text-sm leading-relaxed">{{ product.description }}</p>
    </div>
  </div>
</div>
