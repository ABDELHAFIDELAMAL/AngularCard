<header class="w-full bg-white border-b border-gray-200 fixed z-50 top-0 left-0 right-0">
  <nav class="w-full px-4 sm:px-6 lg:px-10">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between">
      <a
          routerLink="/"
          (click)="closeMenu()"
          class="flex items-center gap-2.5"
        >
          <div
            class="flex h-9 w-9 items-center justify-center
                   bg-gray-900 text-white"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              class="h-5 w-5 rounded"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 8h12l1 13H5L6 8Z"
              />

              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 8V6a3 3 0 0 1 6 0v2"
              />
            </svg>
          </div>
      
          <span class="text-base font-semibold text-gray-900">
            Tech Wave
          </span>
        </a>


      <!-- DESKTOP NAV -->
      <div class="hidden items-center gap-8 md:flex">
        <a
          routerLink="/store"
          class="text-sm text-gray-500 transition hover:text-gray-900"
        >
          Home
        </a>
        <a
          routerLink="/store"
          class="text-sm text-gray-500 transition hover:text-gray-900"
        >
          Store
        </a>
        <a
          routerLink="/about"
          class="text-sm text-gray-500 transition hover:text-gray-900"
        >
          About Us
        </a>
        <a
          routerLink="/support"
          class="text-sm text-gray-500 transition hover:text-gray-900"
        >
          Support
        </a>
        <a
          routerLink="/contact"
          class="text-sm text-gray-500 transition hover:text-gray-900"
        >
          Contact
        </a>
      </div>

      <div class="hidden md:flex">

        <div
          class="flex h-9 w-44 items-center
                 border border-gray-200
                 bg-gray-50
                 lg:w-52"
        >

          <input
            type="text"
            placeholder="Search"
            class="min-w-0 flex-1 bg-transparent
                   px-4 text-xs text-gray-700
                   outline-none
                   placeholder:text-gray-400"
          />

          <button
            type="button"
            class="mr-1 flex h-7 w-7
                   items-center justify-center
                   text-gray-500
                   hover:bg-gray-900 hover:text-white"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              class="h-4 w-4"
            >
              <circle cx="11" cy="11" r="7"/>
              <path d="m20 20-4-4"/>
            </svg>
          </button>

        </div>

      </div>


      <!-- MOBILE BUTTON -->
      <button
        type="button"
        (click)="toggleMenu()"
        class="flex h-10 w-10 items-center justify-center
               text-gray-700
               hover:bg-gray-100
               md:hidden"
      >

        @if (!isMenuOpen) {

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="h-5 w-5"
          >
            <path d="M4 6h16"/>
            <path d="M4 12h16"/>
            <path d="M4 18h16"/>
          </svg>

        } @else {

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="h-5 w-5"
          >
            <path d="M6 6l12 12"/>
            <path d="M18 6L6 18"/>
          </svg>

        }

      </button>

    </div>


    <!-- MOBILE MENU -->
    @if (isMenuOpen) {

      <div class="border-t border-gray-100 py-4 md:hidden">

        <!-- SEARCH -->
        <div
          class="mb-4 flex h-10 w-full
                 border border-gray-200
                 bg-gray-50"
        >

          <input
            type="text"
            placeholder="Search..."
            class="min-w-0 flex-1 bg-transparent
                   px-4 text-sm outline-none"
          />

          <button
            class="px-4 text-gray-500
                   hover:bg-gray-900 hover:text-white"
          >
            🔍
          </button>

        </div>


        <!-- LINKS -->
        <div class="flex flex-col">

          <a
            routerLink="/store"
            (click)="closeMenu()"
            class="px-4 py-3 text-sm text-gray-600
                   hover:bg-gray-50 hover:text-gray-900"
          >
            Store
          </a>

          <a
            routerLink="/about"
            (click)="closeMenu()"
            class="px-4 py-3 text-sm text-gray-600
                   hover:bg-gray-50 hover:text-gray-900"
          >
            About
          </a>

          <a
            routerLink="/support"
            (click)="closeMenu()"
            class="px-4 py-3 text-sm text-gray-600
                   hover:bg-gray-50 hover:text-gray-900"
          >
            Support
          </a>

          <a
            routerLink="/contact"
            (click)="closeMenu()"
            class="px-4 py-3 text-sm text-gray-600
                   hover:bg-gray-50 hover:text-gray-900"
          >
            Contact
          </a>

        </div>

      </div>

    }

  </nav>

</header>
